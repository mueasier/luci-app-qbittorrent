name: Build for ImmortalWrt 25.12.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'luci-app-qbittorrent/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'luci-app-qbittorrent/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMMORTALWRT_VERSION: '25.12.1'
  TARGET: 'mediatek'
  SUBTARGET: 'filogic'
  SDK_ARCHIVE: immortalwrt-sdk-25.12.1-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 1dede7c6afa3184eda37511e47a628f6674d2da2ce99a65f788f910ec57c9e5a

jobs:
  build:
    name: GL-MT2500 (mediatek/filogic)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd

      - name: Download and verify the release SDK
        run: |
          base_url="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          curl --fail --location --retry 5 "$base_url/$SDK_ARCHIVE" -o "$RUNNER_TEMP/$SDK_ARCHIVE"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_ARCHIVE" | sha256sum --check
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar --zstd -xf "$RUNNER_TEMP/$SDK_ARCHIVE" -C "$GITHUB_WORKSPACE/sdk" --strip-components=1
          # The SDK's extra base feed supplies core libraries such as zlib/OpenSSL.
          # feeds.buildinfo lists only external feeds, so preserve base when merging.
          grep -E '^src-git[[:space:]]+--root=package[[:space:]]+base[[:space:]]' \
            sdk/feeds.conf.default > sdk/feeds.conf
          curl --fail --location --retry 5 "$base_url/feeds.buildinfo" -o sdk/release-feeds.buildinfo
          cat sdk/release-feeds.buildinfo >> sdk/feeds.conf

      - name: Install feeds and the local LuCI package
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          test -f package/feeds/base/zlib/Makefile
          test -f package/feeds/base/openssl/Makefile
          # Replace the feed's LuCI package; use its Enhanced Edition backend and Qt.
          rm -f package/feeds/luci/luci-app-qbittorrent
          cp -a "$GITHUB_WORKSPACE/luci-app-qbittorrent" package/luci-app-qbittorrent

      - name: Configure packages
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=y
          CONFIG_SIGNED_PACKAGES=n
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_qbittorrent-enhanced-edition=m
          CONFIG_PACKAGE_luci-app-qbittorrent=m
          CONFIG_PACKAGE_luci-i18n-qbittorrent-zh-cn=m
          # CONFIG_PACKAGE_qbittorrent is not set
          EOF
          make defconfig
          grep -qx 'CONFIG_TARGET_mediatek=y' .config
          grep -qx 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -qx 'CONFIG_PACKAGE_qbittorrent-enhanced-edition=m' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-qbittorrent=m' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-qbittorrent-zh-cn=m' .config
          grep -Eq '^CONFIG_PACKAGE_zlib=[my]$' .config
          grep -Eq '^CONFIG_PACKAGE_libopenssl=[my]$' .config

      - name: Compile LuCI and its dependencies
        working-directory: sdk
        run: |
          set -o pipefail
          make -j"$(nproc)" package/luci-app-qbittorrent/compile V=s 2>&1 | tee build.log

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find sdk/bin -type f \( -name '*.apk' -o -name '*.ipk' \) \
            -exec cp -t artifacts/ {} +
          # Fail if the expected backend, LuCI package or translation is missing.
          find artifacts -type f -name 'qbittorrent-enhanced-edition[_.-]*' | grep -q .
          find artifacts -type f -name 'luci-app-qbittorrent[_.-]*' | grep -q .
          find artifacts -type f -name 'luci-i18n-qbittorrent-zh-cn[_.-]*' | grep -q .
          cp sdk/.config artifacts/build.config
          cp sdk/feeds.conf artifacts/feeds.buildinfo
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 \
            | sort -z | xargs -0 sha256sum > sha256sums

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-enhanced-immortalwrt-25.12.1-mediatek-filogic-gl-mt2500
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-immortalwrt-25.12.1-mediatek-filogic
          path: sdk/build.log
          if-no-files-found: ignore
          retention-days: 7
